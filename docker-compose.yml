x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-environment: &backend-environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: base64:Zh1SPuHgHG7GVtl5MtNWq48F2JlR7muXjgvtxaJ0J+I=
  APP_URL: http://localhost:8000
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: pesantenku
  DB_USERNAME: pesantenku
  DB_PASSWORD: password
  CACHE_STORE: redis
  SESSION_DRIVER: database
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: pesantenku-local
  REVERB_APP_KEY: pesantenku-local-key
  REVERB_APP_SECRET: pesantenku-local-secret
  REVERB_HOST: localhost
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: localhost,127.0.0.1

services:
  app:
    build: *backend-build
    ports:
      - "8000:8000"
    environment:
      <<: *backend-environment
    depends_on:
      - mysql
      - redis
    command: php artisan serve --host=0.0.0.0 --port=8000

  reverb:
    build: *backend-build
    ports:
      - "8080:8080"
    environment:
      <<: *backend-environment
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      - redis
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  queue:
    build: *backend-build
    environment:
      <<: *backend-environment
    depends_on:
      - mysql
      - redis
    command: php artisan queue:work redis --queue=default,imports,exports,backups --sleep=2 --tries=3 --timeout=300

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pesantenku
      MYSQL_USER: pesantenku
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
