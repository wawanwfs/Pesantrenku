services:
  app:
    image: dunglas/frankenphp:php8.4
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pesantenku
      DB_USERNAME: pesantenku
      DB_PASSWORD: password
    depends_on:
      - mysql
      - redis
    command: php artisan serve --host=0.0.0.0 --port=8000

  reverb:
    image: dunglas/frankenphp:php8.4
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REDIS_HOST: redis
    depends_on:
      - redis
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pesantenku
      MYSQL_USER: pesantenku
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
