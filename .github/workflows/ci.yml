name: Pesantrenku CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - run: npm ci
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm run build
      - run: php artisan test
      - run: composer audit --locked
      - run: npm audit --audit-level=high
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: pesantenku-source-sbom.cdx.json

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env && php artisan key:generate && php artisan reverb:install --no-interaction && touch database/database.sqlite
      - run: php artisan migrate:fresh --seed --force
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/playwright-report

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  deployment-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test, e2e, mobile]
    steps:
      - name: Verify deployed health endpoint
        env:
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
        run: test -n "$DEPLOYMENT_URL" && curl --fail --retry 5 --retry-delay 5 "$DEPLOYMENT_URL/health"
