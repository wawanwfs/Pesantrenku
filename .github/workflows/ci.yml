name: Pesantrenku CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce immutable GitHub Action references
        working-directory: .
        run: bash deploy/scripts/check-action-pins.sh
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - run: npm ci
      - name: Validate OpenAPI contract
        run: npm run lint:openapi -- --format=github-actions
      - name: Check OpenAPI route parity
        run: npm run lint:openapi-parity
      - name: Enforce production CSP compatibility
        run: npm run lint:csp
      - name: Enforce RC6 hardening contracts
        run: npm run lint:hardening
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm run build
      - run: npm run check:performance-budget
      - run: php artisan test
      - run: composer audit --locked
      - run: npm audit --audit-level=high
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: backend/vendor,backend/node_modules
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: pesantenku-source-sbom.cdx.json

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: ${{ vars.MYSQL_TEST_IMAGE }}
        env:
          MYSQL_DATABASE: pesantenku_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, simplexml, zip
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Verify MySQL schema and production hardening invariants
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: pesantenku_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          BROADCAST_CONNECTION: 'null'
          PESANTRENKU_OTEL_ENABLED: 'false'
          OTEL_SDK_DISABLED: 'true'
        run: |
          php artisan migrate:fresh --seed --force
          php artisan pesantenku:domain-preflight
          php artisan test tests/Feature/ProductionHardeningTest.php tests/Feature/BackupIntegrityTest.php

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env && php artisan key:generate && php artisan reverb:install --no-interaction && touch database/database.sqlite
      - run: php artisan migrate:fresh --seed --force
      - run: npm run build
      - run: npm run check:performance-budget
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: backend/playwright-report

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze
      - run: flutter test
      - name: Compile Android debug artifact
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://ci.invalid/api/v1

  deployment-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test, mysql-integration, e2e, mobile]
    steps:
      - name: Verify deployed health endpoint
        env:
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
        run: test -n "$DEPLOYMENT_URL" && curl --fail --retry 5 --retry-delay 5 "$DEPLOYMENT_URL/health"
