name: Automated Recovery Drill

on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pesantenku-recovery-drill
  cancel-in-progress: false

jobs:
  pitr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_RECOVERY_IMAGE: ${{ vars.MYSQL_RECOVERY_IMAGE }}
      MYSQL_BINLOG_IMAGE: ${{ vars.MYSQL_BINLOG_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - name: Validate immutable recovery images
        run: |
          for image in "$MYSQL_RECOVERY_IMAGE" "$MYSQL_BINLOG_IMAGE"; do
            if [[ ! "$image" =~ @sha256:[a-f0-9]{64}$ ]]; then
              echo "Recovery images must use immutable sha256 digests." >&2
              exit 1
            fi
          done
      - run: docker compose -p pesantenku -f docker-compose.recovery.yml up -d --wait
      - run: php artisan migrate:fresh --seed --force
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_DATABASE: pesantenku
          DB_USERNAME: root
          DB_PASSWORD: recovery-secret
      - name: Run point-in-time recovery drill
        id: pitr
        run: bash deploy/scripts/pitr-drill.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.pitr.outcome != 'skipped'
        with:
          name: pitr-drill-report
          path: build/pitr/report.json
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: docker compose -p pesantenku -f docker-compose.recovery.yml down -v
