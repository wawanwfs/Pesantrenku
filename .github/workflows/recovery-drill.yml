name: Automated Recovery Drill

on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:

jobs:
  pitr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: docker compose -p pesantenku -f docker-compose.recovery.yml up -d --wait
      - run: php artisan migrate:fresh --seed --force
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_DATABASE: pesantenku
          DB_USERNAME: root
          DB_PASSWORD: recovery-secret
      - run: bash deploy/scripts/pitr-drill.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pitr-drill-report
          path: build/pitr
      - if: always()
        run: docker compose -p pesantenku -f docker-compose.recovery.yml down -v
