services:
  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE must be an immutable digest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: pesantenku
      MINIO_ROOT_PASSWORD: pesantenku-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-integration-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 20

  minio-init:
    image: ${MINIO_MC_IMAGE:?MINIO_MC_IMAGE must be an immutable digest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set integration http://minio:9000 pesantenku pesantenku-secret &&
        mc mb --ignore-existing integration/pesantenku-integration &&
        (mc ilm rule rm --all --force integration/pesantenku-integration || true) &&
        mc ilm rule add --expire-days 7 --prefix imports/ integration/pesantenku-integration &&
        mc ilm rule add --expire-days 7 --prefix exports/ integration/pesantenku-integration &&
        mc ilm rule add --expire-days 30 --prefix backups/ integration/pesantenku-integration

volumes:
  minio-integration-data:
