groups:
  - name: pesantenku-slo
    rules:
      - record: pesantenku:http_requests:rate5m
        expr: sum(rate(pesantenku_http_requests_total[5m]))
      - record: pesantenku:http_errors:ratio5m
        expr: sum(rate(pesantenku_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(pesantenku_http_requests_total[5m])), 0.001)
      - record: pesantenku:http_latency:average5m
        expr: sum(rate(pesantenku_http_request_duration_sum_microseconds[5m])) / clamp_min(sum(rate(pesantenku_http_request_duration_count[5m])), 0.001) / 1000000
      - record: pesantenku:queue_wait:average5m
        expr: sum(rate(pesantenku_queue_wait_duration_sum_microseconds[5m])) / clamp_min(sum(rate(pesantenku_queue_wait_duration_count[5m])), 0.001) / 1000000
      - record: pesantenku:slow_queries:rate5m
        expr: sum(rate(pesantenku_database_slow_queries_total[5m]))
      - alert: PesantenkuTargetDown
        expr: up{job="pesantenku"} == 0
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: Pesantenku metrics target is unreachable
      - alert: PesantenkuHighErrorRate
        expr: pesantenku:http_errors:ratio5m > 0.01
        for: 10m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: Pesantenku error rate exceeds 1 percent
      - alert: PesantenkuHighAverageLatency
        expr: pesantenku:http_latency:average5m > 0.75
        for: 15m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: Pesantenku average request latency exceeds 750 ms
      - alert: PesantenkuQueueFailures
        expr: increase(pesantenku_queue_jobs_failed_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
          slo: durability
        annotations:
          summary: Queue jobs are failing
      - alert: PesantenkuSlowQueryBurst
        expr: pesantenku:slow_queries:rate5m > 1
        for: 10m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: More than one slow query per second is observed
      - alert: PesantenkuQueueWaitHigh
        expr: pesantenku:queue_wait:average5m > 30
        for: 10m
        labels:
          severity: warning
          slo: queue-latency
        annotations:
          summary: Average queue wait exceeds 30 seconds
      - alert: PesantenkuRealtimeSilent
        expr: sum(increase(pesantenku_reverb_events_total[30m])) == 0
        for: 30m
        labels:
          severity: warning
          slo: realtime
        annotations:
          summary: No realtime notification events observed in 30 minutes
      - alert: PesantenkuMetricsStorageUnavailable
        expr: pesantenku_metrics_storage_available == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Metrics cache backend is unavailable
      - alert: PesantenkuMetricsExporterLeaderMissing
        expr: sum by (track, revision) (pesantenku_metrics_exporter_leader) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No Pesantenku metrics exporter leader for {{ $labels.track }}/{{ $labels.revision }}"
          description: "All replicas for this revision have failed to hold the exporter lease, so queue and runtime gauges are unavailable."

      - alert: PesantenkuQueueBacklog
        expr: max by (queue) (pesantenku_queue_depth{state="pending"}) > 100
        for: 10m
        labels:
          severity: warning
          slo: queue-latency
        annotations:
          summary: Queue {{ $labels.queue }} has more than 100 pending jobs
      - alert: PesantenkuWorkerHeartbeatStale
        expr: pesantenku_worker_heartbeat_age_seconds < 0 or pesantenku_worker_heartbeat_age_seconds > 120
        for: 5m
        labels:
          severity: critical
          slo: durability
        annotations:
          summary: Queue worker heartbeat is missing or stale
      - alert: PesantenkuRuntimeHeartbeatStale
        expr: pesantenku_runtime_heartbeat_age_seconds < 0 or pesantenku_runtime_heartbeat_age_seconds > 120
        for: 5m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: Runtime {{ $labels.component }}/{{ $labels.name }} heartbeat is missing or stale
      - alert: PesantenkuBackupStale
        expr: pesantenku_backup_last_success_age_seconds < 0 or pesantenku_backup_last_success_age_seconds > 86400
        for: 15m
        labels:
          severity: critical
          slo: durability
        annotations:
          summary: No successful tenant backup has completed within 24 hours
      - alert: PesantenkuOperationalDrillStale
        expr: pesantenku_operational_drill_last_success_age_seconds < 0 or pesantenku_operational_drill_last_success_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
          slo: operability
        annotations:
          summary: End-to-end operational drill has not succeeded within 24 hours
