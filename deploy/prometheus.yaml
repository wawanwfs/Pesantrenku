global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: pesantenku
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/pesantenku_metrics_token
    static_configs:
      - targets: [app:8000]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
