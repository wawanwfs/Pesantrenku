services:
  mysql-source:
    image: ${MYSQL_RECOVERY_IMAGE:?MYSQL_RECOVERY_IMAGE must be an immutable digest}
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-expire-logs-seconds=604800"]
    environment:
      MYSQL_ROOT_PASSWORD: recovery-secret
      MYSQL_DATABASE: pesantenku
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-precovery-secret"]
      interval: 3s
      timeout: 3s
      retries: 30

  mysql-recovery:
    image: ${MYSQL_RECOVERY_IMAGE:?MYSQL_RECOVERY_IMAGE must be an immutable digest}
    command: ["--server-id=2", "--skip-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: recovery-secret
      MYSQL_DATABASE: pesantenku
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-precovery-secret"]
      interval: 3s
      timeout: 3s
      retries: 30
